# Not modelled, with the reason. Do not add one without knowing how the game applies it.
#
# * Need a condition the engine cannot ask yet: Fleet Phantom (reduces a penalty, not a stat), Bracing Anchor (+4 % a
#   stage block, but also a flat -16 % movement speed at every stage, which `value_per_stage` cannot carry), Peace of
#   Mind, Juggernaut, On Guard and Rousing Speed (Crowd Control Immunity: there is no `SelfState` for it), Survival
#   Instincts (afflicted by ANY status effect: `Affliction` knows only Burning, Chilled and Concussed), Pain's Refuge
#   (a count of negative effects), Force of Nature (a count of status effects on the target), Strategic Reserve (per 10
#   Ultimate).
# * Procs and triggers, which belong to the simulator: Foresight, Riposte, Last Stand, Reinforced, Cleansing Revival,
#   Reaving Blows, Occult Overload, Cutting Defense, Soothing Shield, Salve of Renewal, Hope Infusion, From the Brink,
#   Enlivening Overflow, Siphoning Spells, Bloody Renewal, Expert Evasion, Slippery, Relentlessness, Thrill of the
#   Hunt, Unchained.
# * No channel for what they do: Ironclad (direct damage taken) and Duelist's Rebuff (single target damage taken):
#   `DamageTakenContext` has no `Direct` or `SingleTarget`; Hardened (crowd control immunity duration), Tempered Soul,
#   Shield Master (damage shield cost), War Mount (its number is not in the table: the tooltip says <<1>>), Steadfast
#   Enchantment, Discipline Artisan, and the crafting, harvesting, fishing, thieving and furnishing stars.