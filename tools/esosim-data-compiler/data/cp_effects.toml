# Not modelled, with the reason. Do not add one without knowing how the game applies it.
#
# * Need a condition the engine cannot ask yet: Bulwark (shield / frost staff equipped), Backstabber (flanking),
#   Exploiter (Off Balance), Nimble Protector (bracing), Hasty (sprinting), Fleet Phantom (sneaking),
#   Bracing Anchor, Ward Master (bracing + shield), Peace of Mind, Juggernaut, On Guard, Arcane Alacrity and Rousing
#   Speed (shield / crowd control immunity), Sustained by Suffering, Pain's Refuge, Survival Instincts (afflicted by
#   a status effect), Force of Nature (per status effect).
# * Procs and triggers, which belong to the simulator: Foresight, Riposte, Last Stand, Reinforced, Cleansing Revival,
#   Reaving Blows, Occult Overload, Cutting Defense, Soothing Shield, Salve of Renewal, Hope Infusion, From the Brink,
#   Enlivening Overflow, Siphoning Spells, Bloody Renewal, Expert Evasion, Slippery, Relentlessness, Thrill of the
#   Hunt, Refreshing Stride, Unchained.
# * No channel for what they do: Rejuvenator (healing abilities only), Soothing Tide (area of effect healing),
#   Strategic Reserve, Ironclad (direct damage taken), Duelist's Rebuff (single target damage taken), Hardened
#   (crowd control immunity duration), Mystic Tenacity (status effect duration), Tempered Soul, Shield Master
#   (damage shield cost), War Mount (its number is not in the table: the tooltip says <<1>>), and the crafting,
#   gold and fishing stars.
# * Need a decision first: Spirit Mastery ("decreases the time it takes to resurrect by 33 %": `ResurrectionSpeed`
#   exists, but is it a speed or a time?), Piercing Gaze and Out of Sight (stealth units: `StealthDetection` /
#   `DetectionRadius`).
