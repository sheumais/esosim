# Which engine channels each champion point star feeds (roadmap 2.2c).
#
# The NUMBER is never written here: it is `value_per_stage` of the star in `cp.jsonl` (the game's own
# CP table), times `scale` (default 1.0). Only the meaning is written by hand, because the table says how
# much a stage is worth but not what of. The compiler turns each entry into an `EffectDef`
# (id = the star's ability id, `PerStack { max = max_stages }`, source `ChampionPoint { cp_id = star id }`)
# and writes them to `cp_effects.jsonl`.
#
#   id        star id (`cp.jsonl`), NOT the ability id
#   name      the star's name; the compiler fails if the table says something else
#   channels  each `{ channel = <Channel>, scale = 1.0 }`: one stage adds `value_per_stage * scale`
#   condition default "Always"; `note` is copied to the effect
#
# Units follow the bucket the channel aggregates into (`Channel::agg_kind`):
#
#   * Additive channels hold flat amounts, or percentage points for the channels without an `AggKind`
#     (`CriticalDamage`, `Healing*`, `MovementSpeed`, `MountSpeed`, `StatusEffectChance`, ...): the
#     game's `3` stays `3` (scale 1.0).
#   * Multiplicative channels (`Power`, `DamageDone`, `DamageTaken`, `CostReductionCCA`, ... with
#     `"Multiplicative"`) hold a FRACTION that the aggregator turns into basis points: 3 % is `0.03`,
#     so a percentage needs `scale = 0.01`. The compiler refuses one that would reach over 100 %.
#   * A reduction of damage taken is negative (`scale = -0.01`); a cost reduction is positive.
#   * Flat bash damage is the one `DamageDone` that is Additive.
#
# Stars that are NOT here have no channel that says what they do (see the end of this file).

