# --- Major / Minor buffs and debuffs (roadmap 2.6): units reviewed, each tied to its record by `check` where
# the record holds the number the channel needs.
# A multiplicative channel holds a fraction (the record stores 5 for 5 %), an additive one flat points or
# percentage points, as for the set effects above. Crit chance is a *rating* (level 66: 21,912 per 100 %), and
# Resolve / Breach are resistance at level 66 (2974 minor, 5948 major); those records store another scale, so
# those rows have no `check` and the note says where the number comes from.
# The magnitudes are the game's tooltip values (the `MajorMinorBuff::tooltip_value` table, Healer's Haven).
# The debuff rows (source `Debuff`) are for the enemy side (2.9): `Player::effective_effects` never switches one
# on for the player, so a set that "grants" Minor Breach or Vulnerability does not hit the wearer.
# `buff_code` is the game's major_minor_id except where noted: Sorcery shares Brutality's codes (1, 2) and Prophecy shares
# Savagery's (3, 4), so each pair counts once (the lowest id, same value) and does not stack; Minor + Major still add.
# Not modelled, and why: Minor Lifesteal / Magickasteal (the enemy heals or restores the *attacker*: a proc, not a
# stat), the light-attack Empower abilities (only the heavy-attack one, 61737, is written), Major Vexation (no ability record in the bundle).

