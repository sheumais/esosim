# Hand-written effects that always beat auto-classification (roadmap 2.0 item 2, decision D4).
#
# Everything the classifier cannot see (conditions, stacking, procs, durations) is written here
# by a person. Draft an entry with `esosim-data-compiler suggest-effects <category>`, review it,
# finish the TODOs and paste it below. Each `[[effect]]` is an `esosim_types::EffectDef` as TOML:
#
#   id            ability id, or a synthetic id >= 0x8000_0000 (2147483648) when no ability is behind it
#   name          our name for the effect
#   game_name     the ability's name in the game; `verify` compares it with the lang name
#                 (default: `name`; ignored for synthetic ids)
#   source        e.g. "Food", { Buff = { ability_id = 1 } }, { Mundus = { ability_id = 1 } },
#                 { ChampionPoint = { cp_id = 1 } }, { Set = { set_id = 1, pieces_required = 5 } }
#   channels      non-empty: [{ channel = "CriticalChance", value = 1212.0, value_per_stack = 0.0 }]
#                 (a channel is "CriticalChance" or externally tagged: { Armour = "All" })
#   condition     default "Always"; see esosim_types::Condition
#   stacking      default "Unique"; "Additive" or { PerStack = { max = 10 } }
#   buff_code     the ability's `major_minor_id` for a Major/Minor buff: every ability with the same code
#                 gives the same buff, which counts once however many are active (default: none)
#   duration_ms, cooldown_ms, note
#   source_url    where the numbers come from (compiler only, not written to effects.jsonl)
#   check         { field = "value1", scale = 1.0, channel = 0 }: `verify` fails when the channel's
#                 value stops equalling the ability record's `value1` x `scale`; `minus = <ability id>` subtracts
#                 that record's field first (a tier that holds only the increase over the tier below)
#
#
#
#
# /$$$$$$$$ /$$   /$$  /$$$$$$  /$$      /$$ /$$$$$$$  /$$       /$$$$$$$$ 
# | $$_____/| $$  / $$ /$$__  $$| $$$    /$$$| $$__  $$| $$      | $$_____/
# | $$      |  $$/ $$/| $$  \ $$| $$$$  /$$$$| $$  \ $$| $$      | $$      
# | $$$$$    \  $$$$/ | $$$$$$$$| $$ $$/$$ $$| $$$$$$$/| $$      | $$$$$   
# | $$__/     >$$  $$ | $$__  $$| $$  $$$| $$| $$____/ | $$      | $$__/   
# | $$       /$$/\  $$| $$  | $$| $$\  $ | $$| $$      | $$      | $$      
# | $$$$$$$$| $$  \ $$| $$  | $$| $$ \/  | $$| $$      | $$$$$$$$| $$$$$$$$
# |________/|__/  |__/|__/  |__/|__/     |__/|__/      |________/|________/
#
# All / Any / Not nest freely. A condition the build cannot answer (combat state) makes the calculator list
# the effect as conditional instead of adding it. `stacking = { PerStack = { max = N } }` gives
# value + value_per_stack * min(stacks, N); "Unique" (the default) counts once; "Additive" counts every source.
# `buff_code` is the game's major_minor_id: effects with the same code count once.
# [[effect]]
# id = 2147483700
# name = "Example: Dvorak set bonus"
# game_name = "Example"
# source = { Set = { set_id = 19, pieces_required = 5 } }
# channels = [
#   { channel = { Armour = "All" }, value = 1000.0, value_per_stack = 250.0 },
#   { channel = { Penetration = "Spell" }, value = 0.0, value_per_stack = 120.0 },
#   { channel = { Resource = ["Health", "Multiplicative"] }, value = 0.02, value_per_stack = 0.005 },
#   { channel = { DamageDone = ["Monsters", "Multiplicative"] }, value = 0.05 },
#   { channel = { CapRaise = "CriticalDamage" }, value = 5.0 },
# ]
# condition = { All = [
#   { SetPieces = { set_id = 19, at_least = 5 } },
#   { ArmourPieces = { weight = "Heavy", at_least = 3 } },
#   { Any = [{ WeaponEquipped = "DualWield" }, { WeaponEquipped = "OneHandAndShield" }] },
#   { Not = { SelfAfflicted = "Stunned" } },
#   { OnBar = "Front" },
#   { ClassIs = "Necromancer" },
#   { SkillLineSlotted = { skill_line = "Restoration Staff", at_least = 1 } },
#   { TargetIs = "Monster" },
#   { SelfBuffStacks = { ability_id = 61746, at_least = 1 } },
#   { RecentlyOccurred = { event = "Kill", within_ms = 2000 } },
# ] }
# stacking = { PerStack = { max = 5 } }
# buff_code = 250
# duration_ms = 10000
# cooldown_ms = 3000
# source_url = "https://en.uesp.net/wiki/Online:Example"
#
# ---- Vocabulary -------------------------------------------------------------------------------------------
# source     "Food" | "Potion" | "Gear" | "GearTrait" | "Enchant" | "CoreCombat"
#            { Set = { set_id, pieces_required } } | { ChampionPoint = { cp_id } } | { Mundus = { ability_id } }
#            { Race = { name } } | { Class = { name } } | { Passive = { ability_id } } | { ActiveSkill = { ability_id } }
#            { Buff = { ability_id } } | { Debuff = { ability_id } }      (only Set is switched on by a piece count)
# channel    "CriticalChance" "CriticalDamage" "CriticalHealing" "CriticalResistance" "CriticalDamageTaken"
#            "HealingDone" "HealingTaken" "HealingDoneSingleTarget" "HealingDoneOverTime" "MovementSpeed"
#            "BlockMitigation" "DamageShieldStrength" "KillExperience" "UltimateGain" "AttackSpeed" "MundusBoost"
#            { Armour = T } { Penetration = T }                        T: "Flame" "Shock" "Frost" "Earth" "Magic" "Physical"
#                                                                        "Disease" "Poison" "Bleed" "Martial" "Spell" "All"
#            { Power = [Ctx, Agg] } { DamageDone = [Ctx, Agg] }       Ctx: see below;  Agg: "Additive" | "Multiplicative"
#                    `{ SkillLine = "Bow" }` (the name is the game's skill line name); 
#                    `{ Type = "Flame" }` is a damage type; the plain contexts are All, Direct,
#                    DamageOverTime, StatusEffects, AreaOfEffect, SingleTarget, LightAttack, HeavyAttack, ClassAbilities,
#                    Monsters, NonCritical, Bash.
#            { DamageTaken = [Ctx, Agg] }                              Ctx: "All" "AreaOfEffect" "DamageOverTime" "Projectile"
#                                                                        "Monsters" "Players" "Siege" "Fall" { Type = T }
#            { Resource = [R, Agg] } { Recovery = [R, Agg] } { SynergyRestore = [R, Agg] }    R: "Health" "Magicka" "Stamina"
#            { CostReduction = [Mechanic, Agg] }                       Mechanic: "Health" "Magicka" "Stamina" "Ultimate"
#            { CostReductionSkillLine = [Line, Agg] }  { HealingDoneSkillLine = Line }
#            { CostReductionCCA = [Cca, Agg] }                         Cca: "Bash" "Block" "BreakFree" "DodgeRoll" "Sprint" "Sneak"
#            { CapRaise = "CriticalChance" | "CriticalDamage" | "CriticalHealing" | "Resistance" }
#            { HeavyAttackRestore = R }
# condition  "Always" "InCombat" "InPvpArea" "FoodActive"
#            { All = [..] } { Any = [..] } { Not = C }
#            { SetPieces = { set_id, at_least } } { ArmourPieces = { weight = "Light"|"Medium"|"Heavy", at_least } }
#            { SkillLineSlotted = { skill_line, at_least } } { SkillLineAbilityActive = { skill_line, at_least } }
#            { AbilitySlotted = { ability_id } } { OnBar = "Front"|"Backup" }
#            { WeaponEquipped = "OneHandAndShield"|"TwoHanded"|"DualWield"|"Bow"|"DestructionStaff"|"RestorationStaff" }
#            { ClassIs = "Dragonknight"|"Sorcerer"|"Nightblade"|"Warden"|"Necromancer"|"Templar"|"Arcanist" }
#            { SelfBuffActive = id } { TargetDebuffActive = id } { SelfBuffStacks = { ability_id, at_least } }
#            { TargetDebuffStacks = { ability_id, at_least } }
#            { SelfHealthBelowPct = N } { TargetHealthBelowPct = N } { TargetHealthAbovePct = N } { UltimateAtLeast = N }
#            { SelfResourceBelowPct = { resource, pct } } { SelfResourceAbovePct = { resource, pct } }
#            { SelfState = "Blocking"|"Stealthed"|"Sprinting"|"Mounted"|"Channeling"|"SourceActive"|"DamageShielded"|"PetActive" }
#            { SelfAfflicted = A } { TargetAfflicted = A }             A: "Stunned" "Immobilized" "Snared" "Feared"
#                                                                        "Disoriented" "OffBalance" "Silenced" "Taunted"
#            { InForm = "Werewolf"|"Transformed" } { TargetIs = "Monster"|"Boss"|"Player"|"Undead"|"Daedra" }
#            { RecentlyOccurred = { event, within_ms } }

