# --- Roadmap 2.4 slice 3: world and guild skill-line passives, top rank ---
# `source = { Passive = { ability_id } }`, like every passive: `Build::to_player` switches the effect on
# only when `Build.passives` lists that ability id (`grant_rule::passive_effect_rules`). A passive with two numbers is two
# effects that name the same `ability_id`, so one entry in the build turns both on. Roots: `[world_passives]` in roots.toml.

