[package]
name = "esosim-sim"
version = "0.1.0"
edition = "2024"

# Combat simulator (roadmap Stage 5). Depends on the engine, never the reverse: nothing in
# `esosim`, `esosim-types` or `esosim-data` may depend on this crate.
[dependencies]
esosim = { workspace = true }
esosim-types = { workspace = true }
eso-skill-data = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
