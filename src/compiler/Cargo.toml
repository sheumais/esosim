[package]
name = "esosim-data-compiler"
version = "0.1.0"
edition = "2024"

[dependencies]
eso-skill-data = { git = "https://github.com/sheumais/esoskilldataformat" }
eso-item-data = { git = "https://github.com/sheumais/esoitemdataformat" }
eso_common = { git = "https://github.com/sheumais/eso_common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.4.0"
regex = "1"
esosim = { path = "../.." }


[patch."https://github.com/sheumais/esoskilldataformat"]
eso-skill-data = { path = "../../../eso_data_workspace/eso_skill_data" }